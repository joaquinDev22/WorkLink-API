server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  config:
    # Carga el .env local (KEY=VALUE es formato properties). spring-dotenv 4.0 no se engancha en Spring Boot 4.
    import: optional:file:.env[.properties]
  application:
    name: Proyecto_Final_Progra3
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB      # INC-02: CV en PDF de hasta 5 MB (RF06)
      max-request-size: 6MB   # 5 MB de archivo + campos del formulario
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_proyecto_final?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15   # RNF04
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: CHAR
        format_sql: false
        default_batch_fetch_size: 50
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ${JWT_SECRET}                  # sin valor por defecto: si falta, la app no arranca
  expiration: ${JWT_EXPIRATION:36000000} # 10 h (RNF05)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}   # URLs de retorno de Mercado Pago (paso 11)

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-ACCESS-TOKEN}
  webhook-url: ${MERCADOPAGO_WEBHOOK_URL:https://worklink.com/api/v1/pagos/webhook}

google:
  client-id: ${GOOGLE_CLIENT_ID:676138277883-sls4toa9mp0k3b77p0meijfi6r33vuo5.apps.googleusercontent.com}


