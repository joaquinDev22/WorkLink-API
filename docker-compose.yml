services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: bd_proyecto_final
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # MySQL accesible solo desde esta máquina
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically initialize database schema, stored procedures, triggers & seed data
      - ./bd_proyecto_final.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]   # ping responde aunque no haya credenciales
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # Spring Boot Backend API Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bd_proyecto_final?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 36000000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
